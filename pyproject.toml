[build-system]
requires = ["setuptools>=61.0", "wheel", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "sfttoolbox"
dynamic = ["version"]
authors = [
    { name="Chris Sampson", email="christopher.sampson@somersetft.nhs.uk" },
    { name="Sam Vautier", email="samantha.vautier@somersetft.nhs.uk" },
    { name="Jawad Iqbal", email="jawad.iqbal@somersetft.nhs.uk" }
]
description = "Useful tools for sft data science"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "plotly>=5.19",
    "pyvis",
    "folium",
    "geopandas",
    "shapely",
    "networkx",
    "numpy",
    "osmnx",
    "alphashape"
]

[project.urls]
Homepage = "https://github.com/SomersetNHSFoundationTrust/sfttoolbox"
Issues = "https://github.com/SomersetNHSFoundationTrust/sfttoolbox/issues"

[tool.isort]
profile = "black"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["notebooks"]


[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"
